[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "go2-simulation"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
description = "MuJoCo Go2 simulation with Rerun camera and LiDAR visualization"
readme = "README.md"

[project.scripts]
go2-sim = "go2_simulation.simulate_go2:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
